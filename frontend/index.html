    ```
    <div class="container">

        <h1>House Clustering</h1>

        <p class="subtitle">
            Enter house details to predict its cluster
        </p>

        <form id="houseForm">

            <div class="form-group">
                <label for="area">Area (sqft)</label>
                <input type="number" id="area" placeholder="Example: 1500" min="1" required>
            </div>

            <div class="form-group">
                <label for="bedrooms">Bedrooms</label>
                <input type="number" id="bedrooms" placeholder="Example: 3" min="1" required>
            </div>

            <div class="form-group">
                <label for="bathrooms">Bathrooms</label>
                <input type="number" id="bathrooms" placeholder="Example: 2" min="1" required>
            </div>

            <div class="form-group">
                <label for="price">Price (Lakhs)</label>
                <input type="number" id="price" placeholder="Example: 70" min="1" required>
            </div>

            <div class="form-group">
                <label for="age">Age (Years)</label>
                <input type="number" id="age" placeholder="Example: 5" min="0" required>
            </div>

            <button type="submit">
                Predict Cluster
            </button>

        </form>

        <div class="result" id="result">

            <h2>Prediction Result</h2>

            <p>
                House belongs to
            </p>

            <div class="cluster-number" id="clusterResult">
                Cluster 3
            </div>

        </div>

        <div class="error" id="errorMessage">
            Please enter valid house details.
        </div>

    </div>

    <script>

        const form = document.getElementById("houseForm");

        const resultBox = document.getElementById("result");

        const clusterResult = document.getElementById("clusterResult");

        const errorMessage = document.getElementById("errorMessage");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();


            const area = Number(document.getElementById("area").value);

            const bedrooms = Number(document.getElementById("bedrooms").value);

            const bathrooms = Number(document.getElementById("bathrooms").value);

            const price = Number(document.getElementById("price").value);

            const age = Number(document.getElementById("age").value);


            // Check input values

            if (
                area <= 0 ||
                bedrooms <= 0 ||
                bathrooms <= 0 ||
                price <= 0 ||
                age < 0
            ) {

                errorMessage.style.display = "block";

                resultBox.style.display = "none";

                return;
            }


            errorMessage.style.display = "none";


            try {

                // Send data to Flask backend

                const response = await fetch(
                    "http://127.0.0.1:5000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            area: area,
                            bedrooms: bedrooms,
                            bathrooms: bathrooms,
                            price: price,
                            age: age
                        })
                    }
                );


                // Get prediction from backend

                const data = await response.json();


                // Display cluster

                clusterResult.textContent =
                    "Cluster " + data.cluster;

                resultBox.style.display = "block";

            }

            catch (error) {

                console.log(error);

                errorMessage.textContent =
                    "Backend connection failed. Make sure app.py is running.";

                errorMessage.style.display = "block";

                resultBox.style.display = "none";

            }

        });

    </script>

    ```
